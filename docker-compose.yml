version: "3.9"

services:
  # ── PostgreSQL + pgvector ────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: ei-postgres
    environment:
      POSTGRES_USER: pawan
      POSTGRES_DB: engineering_intelligence
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawan -d engineering_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ei-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pawan@db:5432/engineering_intelligence
      DATABASE_URL_SYNC: postgresql://pawan@db:5432/engineering_intelligence
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:12b-it-q4_K_M}
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      FRONTEND_URL: http://localhost:3000
      APP_ENV: production
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Frontend (Next.js) ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ei-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
